name: openwave
description: "OpenWave Android music streaming app built incrementally."
publish_to: 'none'

version: 0.9.0+9

environment:
  sdk: ^3.11.5

dependencies:
  app_links: ^7.0.0
  audio_session: ^0.2.3
  cloud_firestore: ^6.4.1
  crypto: ^3.0.7
  file_picker: 11.0.2
  firebase_auth: ^6.5.1
  firebase_core: ^4.9.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  flutter_secure_storage: ^10.2.0
  google_sign_in: ^7.2.0
  http: ^1.6.0
  just_audio: ^0.10.5
  just_audio_background: ^0.0.1-beta.17
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  speech_to_text: ^7.4.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
