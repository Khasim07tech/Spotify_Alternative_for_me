name: openwave
description: "OpenWave Android music streaming app built incrementally."
publish_to: 'none'

version: 0.3.0+3

environment:
  sdk: ^3.11.5

dependencies:
  audio_session: ^0.2.3
  firebase_auth: ^6.5.1
  firebase_core: ^4.9.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  google_sign_in: ^7.2.0
  just_audio: ^0.10.5
  just_audio_background: ^0.0.1-beta.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
